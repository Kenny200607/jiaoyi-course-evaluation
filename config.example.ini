; 交醫課程評價工具。本機設定為明文，請勿分享填好帳密的檔案。
[user-account]
; 兩項都留空時，在瀏覽器手動登入；不要只填其中一項。
username =
password =

[browser-option]
; 可選 Chrome 或 Edge；名稱不分大小寫。
driver = Chrome
; 留空自動尋找瀏覽器；也可填完整 exe 路徑，不需加引號。
exe_path =
; 一般留空自動取得匹配的驅動；首次使用可能需要下載。
driver_path =

[evaluation-option]
; false：只預覽，不提交。true：正式提交前仍須本次確認。
submit = false
; 正式執行上限；0 表示全部有效未完成記錄。
max_courses = 0
; 預覽表單數，至少為 1。
dry_run_limit = 1

[script-option]
; 是否隱藏瀏覽器；手動登入時請保持 false。
headless = false
; 任務成功後是否關閉本次瀏覽器。
close_browser_on_finish = false
