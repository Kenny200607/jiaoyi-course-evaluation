; 交医课程评价工具。本机设置为明文，请勿分享填好账号密码的文件。
[user-account]
; 两项都留空时，在浏览器手动登录；不要只填其中一项。
username =
password =

[browser-option]
; 可选 Chrome 或 Edge；名称不分大小写。
driver = Chrome
; 留空自动寻找浏览器；也可填完整 exe 路径，不需加引号。
exe_path =
; 一般留空自动取得匹配的驱动；首次使用可能需要下载。
driver_path =

[evaluation-option]
; highest：自动选每题最高级（最后一项）；也可填 1、2、3、4、5 等等级。
; 数字表示每题从左到右的第几项；不存在或不可选时会停止，请先预览确认。
rating_level = highest
; false：只预览，不提交。true：正式提交前仍须本次确认。
submit = false
; 正式执行上限；0 表示全部有效未完成记录。
max_courses = 0
; 预览表单数，至少为 1。
dry_run_limit = 1

[script-option]
; 是否隐藏浏览器；手动登录时请保持 false。
headless = false
; 任务成功后是否关闭本次浏览器。
close_browser_on_finish = false
